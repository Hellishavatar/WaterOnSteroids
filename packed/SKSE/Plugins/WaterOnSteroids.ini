# WaterOnSteroids settings. The in-game Save button rewrites this file.
# Manual edits are read when the game starts.

[General]
# Turns the whole plugin on or off.
bEnabled = true

# Menu background opacity, 0.0 to 1.0.
fWindowAlpha = 0.7

# Key that opens the menu (Windows key code, 0x72 = F3).
uToggleKey = 0x72

[Features]
# Clear Underwater: reduces the underwater blur.
bClearUnderwater = true

# Full Shader for Distant Water: draws distant water with the full shader (refraction, depth, full waves) and each cell's own water type and height.
bFullShaderDistantWater = true

# Disable River Flow: hides the seam where rivers meet distant water; set false to keep river flow, with the seam.
bDisableRiverFlow = true

# Realistic Distant Water: far water keeps its real color, depth and refraction instead of fading to a bright blue sky; keep Disable River Flow on to hide the seam where rivers meet distant water.
bRealisticDistantWater = true

# Remove Sun Glints: removes the flashing sun specks on calm water.
bRemoveSunGlints = true

[WaterDepth]
# Water Depth: uses the values below instead of the game's (false = game values).
# Each value: 0.0 = no fade, 1.0 = full fade toward the shore.
bFixDepthProperties = true

# Reflection fade near the shore.
fReflections = 1

# Refraction fade near the shore.
fRefraction = 0.7

# Wave fade near the shore.
fNormals = 0.91

# Sun glare fade near the shore.
fSpecularLighting = 1

[WaterTransparency]
# Water clarity in percent: 0 = unchanged, 100 = fully clear.
fWaterTransparency = 10

[WaterColors]
# Uses the colors below (false = the game's colors).
bHasCustomColors = false

# 0 = Direct Override (uses f*Color), 1 = Tint / Multiplier (uses f*Scale).
iColorMode = 0

# Shallow water color, 0.0 to 1.0 per channel.
fShallowColorR = 0
fShallowColorG = 0
fShallowColorB = 0

# Deep water color, 0.0 to 1.0 per channel.
fDeepColorR = 0
fDeepColorG = 0.118812
fDeepColorB = 0.101167

# Reflection color, 0.0 to 1.0 per channel.
fReflectionColorR = 0.0151946
fReflectionColorG = 0.0990099
fReflectionColorB = 0.0716247

# Shallow color multiplier, 0.0 to 3.0 per channel (1.0 = unchanged).
fShallowScaleR = 1
fShallowScaleG = 1
fShallowScaleB = 1

# Deep color multiplier, 0.0 to 3.0 per channel (1.0 = unchanged).
fDeepScaleR = 1
fDeepScaleG = 1
fDeepScaleB = 1

# Reflection color multiplier, 0.0 to 3.0 per channel (1.0 = unchanged).
fReflectionScaleR = 1
fReflectionScaleG = 1
fReflectionScaleB = 1

[Logging]
# Starts the live water log when the game starts.
bLiveWaterLog = false
